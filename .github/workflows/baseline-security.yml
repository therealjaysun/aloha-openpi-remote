name: Baseline security

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare audited remotes
        run: |
          git remote set-url origin https://github.com/therealjaysun/pi-robotics.git
          git remote set-url --push origin https://github.com/therealjaysun/pi-robotics.git
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Physical-Intelligence/openpi.git
          git remote set-url --push upstream DISABLED
          git fetch --no-tags upstream main:refs/remotes/upstream/main

      - name: Install Gitleaks and audit public content
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          export PATH="$GOBIN:$PATH"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          make secret-scan
          scripts/public_repo_audit.sh
