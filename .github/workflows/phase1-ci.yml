name: Phase 1 CPU checks

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  pure-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Create lightweight Python environment
        run: |
          uv venv --no-project --python 3.10 examples/aloha_sim/.venv
          uv pip install --python examples/aloha_sim/.venv/bin/python --require-hashes -r requirements/project-test.txt

      - name: Run pure checks
        run: make ci
